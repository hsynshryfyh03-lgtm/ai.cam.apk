name: Convert custom YOLO (.pt to ONNX)

# يحوّل أي نموذج YOLO بصيغة .pt إلى ONNX ليستخدمه التطبيق بأصنافه الخاصة.
# طريقتان لإدخال الملفات (أي منهما يكفي، ويمكن الجمع بينهما):
#   1) إصدار GitHub بوسم pt-inbox: أرفق ملفات .pt (حتى 2GB للملف) ثم انشر الإصدار أو حدّثه.
#   2) المجلد custom-models/ داخل المستودع (حتى 100MB للملف عند الرفع من الحاسوب، و25MB من المتصفح).
# النتيجة: custom-<الاسم>.onnx و custom-index.json في إصدار "models"، وتظهر في تبويب النماذج بالتطبيق.
# لا يُعاد تحويل ملف لم يتغيّر، ويُرفض أي ملف يحوي استدعاءات خطيرة قبل تحميله.

on:
  workflow_dispatch:
    inputs:
      imgsz:
        description: "حجم المدخل (auto = يُقرأ من نقطة الضبط، مثال: 640)"
        default: "auto"
      force:
        description: "أعد تحويل الملفات المحوّلة سابقاً"
        type: boolean
        default: false
  push:
    paths:
      - "custom-models/*.pt"
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: convert-pt
  cancel-in-progress: false

jobs:
  convert:
    if: github.event_name != 'release' || github.event.release.tag_name == 'pt-inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect .pt files
        id: collect
        run: |
          mkdir -p inbox out
          shopt -s nullglob
          for f in custom-models/*.pt; do cp "$f" inbox/; done
          if gh release view pt-inbox >/dev/null 2>&1; then
            gh release download pt-inbox --pattern '*.pt' --dir inbox --clobber || true
          fi
          count=$(find inbox -maxdepth 1 -name '*.pt' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count .pt file(s)"
          ls -la inbox

      - name: Nothing to convert
        if: steps.collect.outputs.count == '0'
        run: echo "::notice::لا توجد ملفات .pt. أرفقها بإصدار pt-inbox أو ضعها في custom-models/ ثم أعد التشغيل."

      - name: Setup Python
        if: steps.collect.outputs.count != '0'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.collect.outputs.count != '0'
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install ultralytics onnx onnxslim onnxruntime

      - name: Fetch existing index
        if: steps.collect.outputs.count != '0'
        run: gh release download models --pattern custom-index.json --dir out --clobber || true

      - name: Convert
        id: convert
        if: steps.collect.outputs.count != '0'
        continue-on-error: true
        env:
          IMGSZ: ${{ github.event.inputs.imgsz }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: python tools/convert_pt.py --src inbox --out out --imgsz "${IMGSZ:-auto}" $FORCE_FLAG

      - name: Publish to release "models"
        if: always() && steps.collect.outputs.count != '0'
        run: |
          gh release view models >/dev/null 2>&1 || \
            gh release create models --prerelease --title "YOLO models (ONNX)" --notes "Models exported for SentinelAI"
          files=()
          for f in out/custom-*.onnx out/custom-index.json; do
            if [ -e "$f" ]; then files+=("$f"); fi
          done
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload models "${files[@]}" --clobber
          fi
          ls -la out

      - name: Fail if any file could not be converted
        if: steps.convert.outcome == 'failure'
        run: |
          echo "::error::تعذّر تحويل ملف أو أكثر. افتح ملخص التشغيل (Summary) لمعرفة السبب لكل ملف."
          exit 1
